services:
  web-server:
    build:
      context: ./web-server
      dockerfile: Dockerfile
    container_name: city-dynamic.web-server
    volumes:
      - ./web-server:/var/www/html
      - ./ca-certs:/etc/ssl/certs/custom
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
      - kafka
    networks:
      - city-dynamic-network
    command: sh -c "cp .env.example .env && composer install --no-interaction --prefer-dist --optimize-autoloader && php artisan key:generate && php artisan migrate:fresh --seed --force && php artisan serve --host=0.0.0.0 --port=8000"
    environment:
      DB_HOST: mysql
      DB_DATABASE: dynamic_city
      DB_USERNAME: root
      DB_PASSWORD: admin

  websocket-server:
    build:
      context: ./websocket-server
      dockerfile: Dockerfile
    container_name: city-dynamic.websocket-server
    volumes:
      - ./websocket-server:/var/www/html
      - ./ca-certs:/etc/ssl/certs/custom
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    networks:
      - city-dynamic-network

  websocket-client:
    build:
      context: ./websocket-client
      dockerfile: Dockerfile
    container_name: city-dynamic.websocket-client
    volumes:
      - ./websocket-client:/var/www/html
      - ./ca-certs:/etc/ssl/certs/custom
    ports:
      - "8081:8081"
    depends_on:
      - websocket-server
    networks:
      - city-dynamic-network

  redis:
    image: redis:latest
    container_name: city-dynamic.redis
    ports:
      - "6379:6379"
    networks:
      - city-dynamic-network

  kafka:
    image: wurstmeister/kafka:latest
    container_name: city-dynamic.kafka2
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    ports:
      - "9093:9093"
    networks:
      - city-dynamic-network

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: city-dynamic.zookeeper
    ports:
      - "2181:2181"
    networks:
      - city-dynamic-network

  mysql:
    image: mysql:latest
    container_name: city-dynamic.mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: dynamic_city
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - city-dynamic-network

  mongo:
    image: mongo
    container_name: city-dynamic.mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    networks:
      - city-dynamic-network

  mongo-express:
    image: mongo-express
    container_name: city-dynamic.mongo-express
    ports:
      - 8082:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH: false
    networks:
      - city-dynamic-network

networks:
  city-dynamic-network:
    driver: bridge

volumes:
  mysql_data:
